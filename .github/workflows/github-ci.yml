name: github-ci

on:
  push:
    paths:
      - "terraform/**"
      - ".pre-commit-config.yaml"
      - ".tflint.hcl"
      - ".terraform-docs.yml"
  pull_request:
    branches:
      - main

env:
  terraform_version: "1.10.3"
  tflint_version: v0.58.1

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform_version }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  meta-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run meta hooks
        run: |
          SKIP=terraform_fmt,terraform_docs,terraform_tflint,terraform_validate \
            pre-commit run --all-files

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check terraform-docs drift
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: "terraform,terraform/modules/github-repository,terraform/modules/spacelift-module,terraform/modules/tfe-workspace"
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          git-push: "false"
          fail-on-diff: "true"

  tflint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.tflint_version }}

      - name: Show TFLint version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact --recursive --config="${{ github.workspace }}/.tflint.hcl"

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform_version }}
          terraform_wrapper: false

      - name: Validate root
        run: |
          terraform -chdir=terraform init -backend=false -lockfile=readonly
          terraform -chdir=terraform validate

      - name: Validate github-repository module
        run: |
          terraform -chdir=terraform/modules/github-repository init -backend=false
          terraform -chdir=terraform/modules/github-repository validate

      - name: Validate spacelift-module
        run: |
          terraform -chdir=terraform/modules/spacelift-module init -backend=false
          terraform -chdir=terraform/modules/spacelift-module validate

      - name: Validate tfe-workspace module
        run: |
          terraform -chdir=terraform/modules/tfe-workspace init -backend=false
          terraform -chdir=terraform/modules/tfe-workspace validate
